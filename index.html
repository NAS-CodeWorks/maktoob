<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:5173 ws://localhost:5173" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10251D" />
    <title>مكتوب — من السجلات إلى الديسكتوب</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #10251D;
        overflow: hidden;
      }

      #startup-overlay {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 999999;
        background-color: #10251D;
        background-image:
          radial-gradient(circle at 50% 38%, #183a2d 0%, #10251D 65%, #091712 100%),
          radial-gradient(ellipse at 50% 95%, rgba(197, 166, 100, 0.08) 0%, transparent 70%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: "Segoe UI", Tahoma, sans-serif;
        color: #F5F3ED;
        user-select: none;
        transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: all;
      }

      #startup-overlay.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .startup-ambient-glow {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 280px;
        height: 280px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(197, 166, 100, 0.35) 0%, rgba(197, 166, 100, 0.1) 45%, transparent 70%);
        opacity: 0;
        animation: startupGlowBloom 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        pointer-events: none;
      }

      .startup-golden-waves {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 120px;
        pointer-events: none;
        opacity: 0.25;
        background: radial-gradient(ellipse at 50% 100%, rgba(197, 166, 100, 0.45) 0%, transparent 75%);
      }

      .startup-mark-wrapper {
        position: relative;
        width: 115px;
        height: 115px;
        margin-bottom: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transform: scale(0.94);
        animation: startupMarkEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
        z-index: 2;
      }

      .startup-mark-svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.5));
      }

      .startup-text-group {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 2;
        opacity: 0;
        transform: translateY(6px);
        animation: startupTextFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
      }

      .startup-title {
        font-size: 38px;
        font-weight: 700;
        color: #F5F3ED;
        letter-spacing: 0.5px;
        line-height: 1.2;
        margin: 0;
        text-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      }

      .startup-tagline {
        font-size: 15px;
        font-weight: 500;
        color: #C5A664;
        margin: 8px 0 0 0;
        letter-spacing: 0.3px;
      }

      .startup-latin {
        font-size: 11px;
        font-weight: 600;
        color: #C5A664;
        letter-spacing: 8px;
        margin-top: 10px;
        opacity: 0.85;
        text-indent: 8px;
        direction: ltr;
      }

      @keyframes startupMarkEntrance {
        0% {
          opacity: 0;
          transform: scale(0.94);
        }
        100% {
          opacity: 1;
          transform: scale(1.0);
        }
      }

      @keyframes startupGlowBloom {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.7);
        }
        60% {
          opacity: 0.9;
        }
        100% {
          opacity: 0.75;
          transform: translate(-50%, -50%) scale(1.0);
        }
      }

      @keyframes startupTextFadeIn {
        0% {
          opacity: 0;
          transform: translateY(6px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div id="startup-overlay">
      <div class="startup-ambient-glow"></div>
      <div class="startup-golden-waves"></div>
      <div class="startup-mark-wrapper">
        <svg class="startup-mark-svg" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- left contractual side / arm -->
          <path d="M92 80 Q92 56 116 56 H154 Q166 56 174 64 L236 126 L204 158 L176 130 L148 154 Q132 168 113 164 L92 154 Z"
                fill="#C5A664" stroke="#10251D" stroke-width="10" stroke-linejoin="round"/>
          <path d="M92 154 L136 176 L136 334 Q136 358 112 358 Q92 358 92 338 Z"
                fill="#C5A664" stroke="#10251D" stroke-width="10" stroke-linejoin="round"/>

          <!-- right contractual side / arm -->
          <path d="M420 80 Q420 56 396 56 H358 Q346 56 338 64 L276 126 L308 158 L336 130 L364 154 Q380 168 399 164 L420 154 Z"
                fill="#C5A664" stroke="#10251D" stroke-width="10" stroke-linejoin="round"/>
          <path d="M420 154 L376 176 L376 334 Q376 358 400 358 Q420 358 420 338 Z"
                fill="#C5A664" stroke="#10251D" stroke-width="10" stroke-linejoin="round"/>

          <!-- joined hands -->
          <path d="M148 154 L204 208 Q216 220 230 210 L250 194 L284 226 L320 190 L276 146 L246 170 Q226 186 206 172 L176 148 Z"
                fill="#C5A664" stroke="#10251D" stroke-width="10" stroke-linejoin="round"/>

          <!-- simplified fingers / handshake rhythm -->
          <path d="M202 222 L244 264" stroke="#C5A664" stroke-width="22" stroke-linecap="round"/>
          <path d="M226 214 L268 256" stroke="#C5A664" stroke-width="22" stroke-linecap="round"/>
          <path d="M250 208 L292 250" stroke="#C5A664" stroke-width="22" stroke-linecap="round"/>
          <path d="M274 202 L312 240" stroke="#C5A664" stroke-width="22" stroke-linecap="round"/>

          <!-- small contract rivets / agreement points -->
          <circle cx="120" cy="126" r="7" fill="#F5F3ED"/>
          <circle cx="392" cy="126" r="7" fill="#F5F3ED"/>
        </svg>
      </div>
      <div class="startup-text-group">
        <h1 class="startup-title">مكتوب</h1>
        <p class="startup-tagline">من السجلات إلى الديسكتوب</p>
        <span class="startup-latin">MAKTOOB</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
