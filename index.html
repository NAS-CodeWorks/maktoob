<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:5173 ws://localhost:5173" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10251D" />
    <title>مكتوب — من السجلات إلى الديسكتوب</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #10251D;
        overflow: hidden;
      }

      #startup-overlay {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 999999;
        background-color: #10251D;
        background-image:
          radial-gradient(circle at 50% 38%, #183a2d 0%, #10251D 65%, #091712 100%),
          radial-gradient(ellipse at 50% 95%, rgba(197, 166, 100, 0.08) 0%, transparent 70%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: "Segoe UI", Tahoma, sans-serif;
        color: #F5F3ED;
        user-select: none;
        transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: all;
      }

      #startup-overlay.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .startup-ambient-glow {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 280px;
        height: 280px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(197, 166, 100, 0.35) 0%, rgba(197, 166, 100, 0.1) 45%, transparent 70%);
        opacity: 0;
        animation: startupGlowBloom 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        pointer-events: none;
      }

      .startup-golden-waves {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 120px;
        pointer-events: none;
        opacity: 0.25;
        background: radial-gradient(ellipse at 50% 100%, rgba(197, 166, 100, 0.45) 0%, transparent 75%);
      }

      .startup-mark-wrapper {
        position: relative;
        width: 115px;
        height: 115px;
        margin-bottom: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transform: scale(0.94);
        animation: startupMarkEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
        z-index: 2;
      }

      .startup-mark-svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.5));
      }

      .startup-text-group {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 2;
        opacity: 0;
        transform: translateY(6px);
        animation: startupTextFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
      }

      .startup-title {
        font-size: 38px;
        font-weight: 700;
        color: #F5F3ED;
        letter-spacing: 0.5px;
        line-height: 1.2;
        margin: 0;
        text-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      }

      .startup-tagline {
        font-size: 15px;
        font-weight: 500;
        color: #C5A664;
        margin: 8px 0 0 0;
        letter-spacing: 0.3px;
      }

      .startup-latin {
        font-size: 11px;
        font-weight: 600;
        color: #C5A664;
        letter-spacing: 8px;
        margin-top: 10px;
        opacity: 0.85;
        text-indent: 8px;
        direction: ltr;
      }

      @keyframes startupMarkEntrance {
        0% {
          opacity: 0;
          transform: scale(0.94);
        }
        100% {
          opacity: 1;
          transform: scale(1.0);
        }
      }

      @keyframes startupGlowBloom {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.7);
        }
        60% {
          opacity: 0.9;
        }
        100% {
          opacity: 0.75;
          transform: translate(-50%, -50%) scale(1.0);
        }
      }

      @keyframes startupTextFadeIn {
        0% {
          opacity: 0;
          transform: translateY(6px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div id="startup-overlay">
      <div class="startup-ambient-glow"></div>
      <div class="startup-golden-waves"></div>
      <div class="startup-mark-wrapper">
        <img src="./branding/maktoob-256.png" alt="مكتوب" class="startup-mark-image" />
      </div>
      <div class="startup-text-group">
        <h1 class="startup-title">مكتوب</h1>
        <p class="startup-tagline">من السجلات إلى الديسكتوب</p>
        <span class="startup-latin">MAKTOOB</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
