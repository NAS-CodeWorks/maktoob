<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مكتوب</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #10251D;
      background-image: 
        radial-gradient(circle at 50% 38%, #183a2d 0%, #10251D 65%, #091712 100%),
        radial-gradient(ellipse at 50% 95%, rgba(197, 166, 100, 0.08) 0%, transparent 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: #F5F3ED;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.fade-out {
      opacity: 0;
    }

    .ambient-glow {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(197, 166, 100, 0.35) 0%, rgba(197, 166, 100, 0.1) 45%, transparent 70%);
      opacity: 0;
      animation: glowBloom 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
      pointer-events: none;
    }

    .golden-waves {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 120px;
      pointer-events: none;
      opacity: 0.25;
      background: radial-gradient(ellipse at 50% 100%, rgba(197, 166, 100, 0.45) 0%, transparent 75%);
    }

    .mark-wrapper {
      position: relative;
      width: 115px;
      height: 115px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.94);
      animation: markEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
      z-index: 2;
    }

    .mark-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.5));
    }

    .text-group {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
      opacity: 0;
      transform: translateY(6px);
      animation: textFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
    }

    .product-title {
      font-size: 38px;
      font-weight: 700;
      color: #F5F3ED;
      letter-spacing: 0.5px;
      line-height: 1.2;
      margin: 0;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }

    .product-tagline {
      font-size: 15px;
      font-weight: 500;
      color: #C5A664;
      margin: 8px 0 0 0;
      letter-spacing: 0.3px;
    }

    .product-latin {
      font-size: 11px;
      font-weight: 600;
      color: #C5A664;
      letter-spacing: 8px;
      margin-top: 10px;
      opacity: 0.85;
      text-indent: 8px;
      direction: ltr;
    }

    @keyframes markEntrance {
      0% { opacity: 0; transform: scale(0.94); }
      100% { opacity: 1; transform: scale(1.0); }
    }

    @keyframes glowBloom {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
      60% { opacity: 0.9; }
      100% { opacity: 0.75; transform: translate(-50%, -50%) scale(1.0); }
    }

    @keyframes textFadeIn {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>
  <div class="golden-waves"></div>
  <div class="mark-wrapper">
    <img src="maktoob-256.png" alt="مكتوب" class="mark-image" />
  </div>
  <div class="text-group">
    <h1 class="product-title">مكتوب</h1>
    <p class="product-tagline">من السجلات إلى الديسكتوب</p>
    <span class="product-latin">MAKTOOB</span>
  </div>
</body>
</html>
